<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Coche')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="contenedor estrecho">
    <h1 th:text="${cocheForm.codigo == null} ? 'Nuevo coche' : ('Editar coche ' + ${cocheForm.codigo})">
        Coche
    </h1>

    <form th:action="@{/coches/guardar}" th:object="${cocheForm}" method="post" class="formulario" novalidate>

        <input type="hidden" th:field="*{codigo}">

        <div class="campo">
            <label for="nombre">Nombre</label>
            <input type="text" th:field="*{nombre}" th:classappend="${#fields.hasErrors('nombre')} ? 'invalido'">
            <div class="error" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}">Error</div>
        </div>

        <div class="campo">
            <label for="precio">Precio (€)</label>
            <input type="number" step="0.01" th:field="*{precio}" th:classappend="${#fields.hasErrors('precio')} ? 'invalido'">
            <div class="error" th:if="${#fields.hasErrors('precio')}" th:errors="*{precio}">Error</div>
        </div>

        <div class="campo">
            <label for="codigoMarca">Marca</label>
            <select th:field="*{codigoMarca}" th:classappend="${#fields.hasErrors('codigoMarca')} ? 'invalido'">
                <option value="">-- Selecciona una marca --</option>
                <option th:each="m : ${marcas}" th:value="${m.codigo}" th:text="${m.nombre}">Marca</option>
            </select>
            <div class="error" th:if="${#fields.hasErrors('codigoMarca')}" th:errors="*{codigoMarca}">Error</div>
        </div>

        <div class="acciones">
            <button type="submit" class="boton azul">Guardar</button>
            <a th:href="@{/coches}" class="boton gris">Cancelar</a>
        </div>
    </form>
</main>
</body>
</html>
