<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Coches de la marca')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="contenedor">
    <div class="cabecera">
        <h1 th:text="'Coches de ' + ${marca.nombre}">Coches de ...</h1>
        <a th:href="@{/marcas}" class="boton gris">Volver a marcas</a>
    </div>

    <table>
        <thead>
        <tr>
            <th>Nombre</th>
            <th>Precio</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${#lists.isEmpty(coches)}">
            <td colspan="2" class="suave">Esta marca no tiene coches</td>
        </tr>
        <tr th:each="co : ${coches}">
            <td th:text="${co.nombre}">Nombre</td>
            <td th:text="${#numbers.formatDecimal(co.precio, 1, 2, 'POINT')} + ' €'">0.00</td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
