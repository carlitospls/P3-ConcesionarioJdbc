<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Marcas')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="contenedor estrecho">
    <h1>Marcas</h1>

    <table>
        <thead>
        <tr>
            <th>Código</th>
            <th>Nombre</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="m : ${marcas}">
            <td th:text="${m.codigo}">1</td>
            <td>
            <a th:href="@{/marcas/{codigo}/coches(codigo=${co.codigo})}"
            th:text="${m.nombre}">Nombre </a>
            </td>

        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
